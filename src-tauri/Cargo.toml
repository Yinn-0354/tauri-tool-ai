[package]
name = "tauri-tool-ai"
version = "0.1.0"
description = "配置表检查工具"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "tauri_tool_ai_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-log = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
